<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>柔柔的英文魔法帖｜Unit 13–14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7DDD7; --bg2:#F1CDC6; --paper:#FFF9F4; --paper2:#FDEFEA;
  --ink:#4B2A2F; --ink2:#7A5257; --ribbon:#8E2238; --ribbon2:#B23A50;
  --gold:#C99541; --goldL:#F5DE9C; --lilac:#A893DA; --lilacL:#EEE7FB;
  --ok:#3F9C6B; --okL:#DDF3E4; --bad:#D9526D; --badL:#FBE0E6; --hl:#FFE7A0;
  --shadow:0 14px 30px -18px rgba(142,34,56,.55); --onR:#FFFFFF;
  --font:"Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --hand:"Klee One","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",cursive;
}
:root[data-theme="dark"]{
  --bg:#2A1720; --bg2:#341D28; --paper:#3B2430; --paper2:#45293A;
  --ink:#F7E7E2; --ink2:#D6B7B9; --ribbon:#F08AA0; --ribbon2:#F5A7B7;
  --gold:#E2B65C; --goldL:#6A4E2A; --lilac:#B9A6EC; --lilacL:#3F3352;
  --ok:#7FD3A0; --okL:#23432F; --bad:#F08AA0; --badL:#4A2430; --hl:#5E4A1E;
  --shadow:0 14px 30px -18px rgba(0,0,0,.8); --onR:#3A1422;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A1720; --bg2:#341D28; --paper:#3B2430; --paper2:#45293A;
    --ink:#F7E7E2; --ink2:#D6B7B9; --ribbon:#F08AA0; --ribbon2:#F5A7B7;
    --gold:#E2B65C; --goldL:#6A4E2A; --lilac:#B9A6EC; --lilacL:#3F3352;
    --ok:#7FD3A0; --okL:#23432F; --bad:#F08AA0; --badL:#4A2430; --hl:#5E4A1E;
    --shadow:0 14px 30px -18px rgba(0,0,0,.8); --onR:#3A1422;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;font-size:17px;
  background-image:radial-gradient(circle at 12px 12px, rgba(255,255,255,.55) 2.2px, transparent 2.6px),radial-gradient(circle at 42px 38px, rgba(255,255,255,.35) 1.6px, transparent 2px);
  background-size:58px 58px;}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--lilac);color:#fff}
mark,.nc,.gl,.tr{-webkit-text-fill-color:currentColor}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 80px}

/* shikishi board */
.board{background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,#F7E3A6,#C8913A 30%,#F9EBC0 55%,#B5802F 80%,#F3D88A) border-box;
  border:6px solid transparent;border-radius:5px;box-shadow:var(--shadow);position:relative}
.board.inner::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.85);border-radius:2px;pointer-events:none}
:root[data-theme="dark"] .board.inner::after{border-color:rgba(255,255,255,.12)}

/* hero */
.hero{margin:6px auto 22px;padding:22px 22px 18px;overflow:hidden;
  background:linear-gradient(160deg,#FBE3DE 0%,#F6CFC9 100%) padding-box,linear-gradient(135deg,#F7E3A6,#C8913A 30%,#F9EBC0 55%,#B5802F 80%,#F3D88A) border-box}
:root[data-theme="dark"] .hero{background:linear-gradient(160deg,#4A2A38,#3A2030) padding-box,linear-gradient(135deg,#F7E3A6,#C8913A 30%,#F9EBC0 55%,#B5802F 80%,#F3D88A) border-box}
.hero .water{position:absolute;top:10px;left:-10px;right:-10px;white-space:nowrap;font-size:20px;letter-spacing:.06em;color:rgba(255,255,255,.75);font-weight:500;pointer-events:none}
:root[data-theme="dark"] .hero .water{color:rgba(255,255,255,.12)}
.hero h1{font-family:var(--hand);font-weight:600;font-size:clamp(34px,7vw,58px);line-height:1.15;margin:34px 0 4px;color:var(--ink);transform:rotate(-3deg);transform-origin:left;letter-spacing:.02em}
.hero h1,.hero .sub,.stats,.stickers{position:relative;z-index:1}
.hero .sub{margin:6px 0 16px;color:var(--ink2);font-size:15px}
.hero .bow{position:absolute;right:18px;top:26px;width:84px;transform:rotate(8deg)}
.flower{position:absolute;pointer-events:none}
.stats{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lv{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 6px;flex:1 1 260px;min-width:0}
.lv b{background:var(--ribbon);color:var(--onR);border-radius:999px;padding:2px 10px;font-size:14px;white-space:nowrap}
.bar{flex:1;height:12px;border-radius:99px;background:var(--paper2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--goldL),var(--gold));border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.lv small{font-size:13px;color:var(--ink2);white-space:nowrap}
.pill{background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.combo b{color:var(--ribbon);font-size:17px}
.combo.hot{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.tools{display:flex;gap:8px;margin-left:auto}
.ic{border:0;background:var(--paper);border-radius:12px;padding:6px 11px;font-size:14px}
.stickers{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--paper);border:2px dashed var(--ink2);opacity:.35;filter:grayscale(1);position:relative;border-width:2px;padding:0}
.stk.on{opacity:1;filter:none;border:2px solid var(--gold);box-shadow:0 0 0 3px var(--goldL)}
.stk.new{animation:stamp .6s}
@keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{transform:scale(.9)}100%{transform:scale(1)}}

/* tabs */
.units{display:flex;gap:6px;margin:0 0 -6px 12px;position:relative;z-index:2;flex-wrap:wrap}
.unit-tab{border:0;padding:10px 18px 14px;border-radius:12px 12px 0 0;background:var(--bg2);color:var(--ink2);font-weight:700;font-size:15px}
.unit-tab[aria-selected="true"]{background:var(--ribbon);color:var(--onR)}
.unit-head{padding:20px 20px 6px;border-radius:5px 5px 0 0}
.unit-head h2{margin:0;font-size:clamp(21px,3.6vw,28px);line-height:1.3}
.unit-head p{margin:4px 0 0;color:var(--ink2)}
.subs{display:flex;gap:6px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub-tab{border:1.5px solid var(--gold);background:transparent;border-radius:999px;padding:6px 15px;white-space:nowrap;font-size:15px}
.sub-tab[aria-selected="true"]{background:var(--goldL);border-color:var(--gold);font-weight:700}
.panel{padding:12px 20px 24px}
.sec-t{font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"❀";color:var(--ribbon2)}
.hint{color:var(--ink2);font-size:14px;margin:-4px 0 12px}

/* passage */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;margin:6px 0 10px}
.legend span{padding:2px 8px;border-radius:6px}
.note{background:var(--lilacL);border-radius:14px;padding:12px 16px;margin:12px 0;font-size:15px}
.note h4{margin:0 0 4px;font-size:16px}
.para{position:relative;padding:12px 0 12px;border-bottom:1.5px dashed var(--bg2)}
.para p{margin:0;font-size:18px;line-height:2}
.para .ctl{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.mini{border:0;background:var(--paper2);border-radius:999px;padding:3px 12px;font-size:13.5px}
.mini.say::before{content:"🔊 "}
.gist{display:none;margin-top:6px;font-size:15px;color:var(--ink2);background:var(--paper2);border-radius:10px;padding:6px 12px}
.gist.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}
.gl{border:0;background:none;padding:0;border-bottom:2px dotted var(--gold);font-size:inherit;line-height:inherit;font-weight:700;color:var(--ink)}
.tr{color:var(--ribbon);font-weight:900;text-decoration:underline wavy var(--ribbon2);text-underline-offset:4px}
.nc{background:var(--lilacL);border-radius:4px;padding:1px 3px;box-shadow:inset 0 -2px 0 var(--lilac)}
.nc::before{content:"[";color:var(--lilac);font-weight:900}.nc::after{content:"]";color:var(--lilac);font-weight:900}
.pop{position:fixed;z-index:50;background:var(--paper);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:15px;max-width:260px;display:none}
.pop.show{display:block;animation:fade .2s}
.pop b{display:block;font-size:17px}

/* vocab cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{padding:14px 16px;text-align:left;border-radius:5px;min-height:130px;cursor:pointer}
.card .w{font-size:24px;font-weight:900;color:var(--ribbon);line-height:1.2}
.card .kk{color:var(--ink2);font-size:15px}
.card .pos{display:inline-block;background:var(--goldL);border-radius:6px;padding:0 7px;font-size:13px;margin-left:4px}
.card .tap{position:absolute;right:12px;bottom:8px;font-size:12.5px;color:var(--ink2)}
.card .back{display:none}
.card.open .back{display:block}
.card.open .tap{display:none}
.card .zh{font-size:17px;font-weight:700;margin-top:8px}
.card .def{font-size:14.5px;color:var(--ink2);font-style:italic;margin:2px 0 8px}
.ex{font-size:15.5px;margin:6px 0 2px}
.ex mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
.exzh{font-size:14px;color:var(--ink2)}
.fam{margin-top:8px;font-size:13.5px;background:var(--paper2);border-radius:8px;padding:4px 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.refs{display:flex;flex-wrap:wrap;gap:8px}
.ref{border:1.5px solid var(--gold);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14.5px}
.ref::before{content:"🔊 ";font-size:12px}
.prog{font-size:14px;color:var(--ink2);margin:0 0 10px}

/* phrases */
.phr{padding:14px 16px;margin-bottom:14px}
.phr h3{margin:0;font-size:20px;color:var(--ribbon)}
.phr .pz{font-weight:700}
.phr .pn{font-size:14.5px;color:var(--ink2);margin:4px 0}
.pat{background:var(--paper2);border-radius:12px;padding:10px 14px;font-size:15.5px;margin:8px 0}
.exl{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.exl .mini{flex:none;margin-top:3px}

/* quiz */
.qset{margin-bottom:26px}
.qset-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qset-h h3{margin:0;font-size:19px}
.mode{display:inline-flex;background:var(--paper2);border-radius:999px;padding:4px;gap:4px;margin:4px 0 8px}
.mode button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:14.5px}
.mode button[aria-pressed="true"]{background:var(--ribbon);color:var(--onR)}
.q{padding:14px 16px 12px;margin:12px 0;border-radius:5px}
.qt{margin:0 0 10px;font-size:17px;font-weight:500}
.qn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ribbon);color:var(--onR);font-size:13.5px;margin-right:8px;vertical-align:2px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink2);text-align:center}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--bg2);background:var(--paper);border-radius:12px;padding:9px 14px;font-size:16px;display:flex;gap:10px;align-items:flex-start;transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt .lt{font-weight:900;color:var(--gold);flex:none}
.opt.pick{border-color:var(--lilac);background:var(--lilacL)}
.opt.ok{border-color:var(--ok);background:var(--okL)}
.opt.ok .lt{color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--badL)}
.opt.ok::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:900}
.opt.no::after{content:"✗";margin-left:auto;color:var(--bad);font-weight:900}
.exp{display:none;margin-top:10px;font-size:15px;background:var(--paper2);border-radius:10px;padding:8px 12px}
.exp.show{display:block;animation:fade .3s}
.big{border:0;background:var(--ribbon);color:var(--onR);border-radius:14px;padding:10px 22px;font-size:16px;font-weight:700;box-shadow:0 4px 0 color-mix(in srgb,var(--ribbon) 60%,#000)}
.big:active{transform:translateY(3px);box-shadow:none}
.big.ghost{background:var(--paper2);color:var(--ink);box-shadow:none}
.score{display:none;text-align:center;padding:18px;margin:12px 0}
.score.show{display:block;animation:stamp .6s}
.score .n{font-family:var(--hand);font-size:54px;color:var(--ribbon);line-height:1.1}
.listen{border:0;background:var(--goldL);border-radius:14px;padding:8px 16px;font-size:16px;margin:0 0 10px}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* games */
.game{padding:16px;margin:12px 0 22px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mt{border:2px solid var(--bg2);background:var(--paper);border-radius:12px;padding:10px;font-size:16px;min-height:48px}
.mt.en{font-weight:700;color:var(--ribbon)}
.mt.sel{border-color:var(--lilac);background:var(--lilacL);transform:scale(1.03)}
.mt.done{border-color:var(--ok);background:var(--okL);opacity:.45;pointer-events:none}
.ord-src{display:grid;gap:8px}
.ord-item{text-align:left;border:2px solid var(--bg2);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:15.5px}
.ord-dst{display:grid;gap:8px;margin-top:12px}
.ord-dst:empty::before{content:"依序點選，正確的會排到這裡 ✦";color:var(--ink2);font-size:14px;padding:12px;border:2px dashed var(--bg2);border-radius:12px;text-align:center}
.placed{display:flex;gap:10px;align-items:flex-start;background:var(--okL);border-radius:12px;padding:10px 14px;font-size:15.5px;animation:fade .3s}
.placed .num{flex:none;font-weight:900;color:var(--ok)}
.placed .yr{margin-left:auto;flex:none;font-weight:700;color:var(--ribbon);font-size:14px}
.cloze-text{font-size:17px;line-height:2.3}
.bl{border:0;border-bottom:2.5px solid var(--gold);background:var(--paper2);border-radius:6px 6px 0 0;min-width:96px;padding:0 8px;font-size:16px;margin:0 2px}
.bl.sel{background:var(--lilacL);border-color:var(--lilac);animation:pop .3s}
.bl.ok{background:var(--okL);border-color:var(--ok);font-weight:700}
.bl.no{background:var(--badL);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border-radius:12px;background:var(--paper2)}
.chip{border:2px solid var(--gold);background:var(--paper);border-radius:999px;padding:4px 14px;font-size:15.5px;font-weight:700}
.chip.used{opacity:.3;pointer-events:none}

/* fx */
.fx{position:fixed;pointer-events:none;z-index:80;font-size:18px;left:0;top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:90;display:flex;gap:12px;align-items:center;padding:12px 18px;max-width:92vw;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.toast.show{transform:translate(-50%,0)}
.toast .ti{font-size:34px}
.toast b{display:block;color:var(--ribbon)}
.toast small{color:var(--ink2)}
@media (max-width:560px){
  body{font-size:16px}.wrap{padding:12px 10px 70px}
  .hero{padding:18px 16px}.hero .bow{width:60px;right:10px}
  .panel{padding:10px 14px 20px}.para p{font-size:17px}
  .match{gap:6px}.mt{font-size:15px;padding:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="board inner hero" id="hero">
    <div class="water" aria-hidden="true">Rourou's Word Magic Notebook ✿ Rourou's Word Magic Notebook ✿ Rourou's Word Magic Notebook</div>
    <svg class="bow" viewBox="0 0 100 70" aria-hidden="true"><path d="M50 32 C30 5,5 8,8 30 C10 48,32 44,50 36Z" fill="#8E2238"/><path d="M50 32 C70 5,95 8,92 30 C90 48,68 44,50 36Z" fill="#8E2238"/><path d="M46 36 L30 66 L40 62 L46 68 L52 38Z" fill="#7A1C2F"/><path d="M54 36 L70 66 L60 62 L54 68 L48 38Z" fill="#7A1C2F"/><ellipse cx="50" cy="34" rx="8" ry="9" fill="#A82E45"/><path d="M20 22 C28 18,38 22,44 30" stroke="#C54A60" stroke-width="3" fill="none"/><path d="M80 22 C72 18,62 22,56 30" stroke="#C54A60" stroke-width="3" fill="none"/></svg>
    <h1>柔柔的英文魔法帖</h1>
    <p class="sub">Unit 13 麻醉的故事 ＆ Unit 14 主題式寫作｜點一點就能學，答對會收集貼紙</p>
    <div class="stats">
      <div class="lv"><b id="lvl">Lv.1</b><div class="bar"><i id="xpbar"></i></div><small id="xptxt">0 / 100 XP</small></div>
      <span class="pill combo" id="combo">連擊 <b>0</b></span>
      <div class="tools">
        <button class="ic" id="rateBtn" title="發音速度">🐢 慢速</button>
        <button class="ic" id="sndBtn" title="音效">🔔 音效開</button>
        <button class="ic" id="themeBtn" title="切換深淺色">🌙</button>
      </div>
    </div>
    <div class="stickers" id="stickers"></div>
  </header>

  <nav class="units" id="units" role="tablist"></nav>
  <main class="board" id="unitBox"></main>
</div>
<div class="pop" id="pop"></div>
<div class="board toast" id="toast"><span class="ti"></span><span><b></b><small></small></span></div>

<script>
/* ============ DATA ============ */
const UNITS = [
{
 id:"u13", tab:"Unit 13 醫學發展", title:"Anesthesia: The Discovery That Transformed Medicine", zh:"麻醉：改寫醫學史的重大發現",
 note:`<h4>老師導讀</h4>全文用「<b>前 vs. 後</b>」對比來寫：先講麻醉發明前手術有多可怕（第 2、3 段），再講 1846 年乙醚登場（第 4 段）、氯仿與劑量問題（第 5 段），最後回到今天（第 6 段）。讀的時候抓紅色波浪線的<b>轉折詞</b>（But / however / While / but），就知道作者在哪裡「轉彎」。紫色框是<b>名詞子句</b>，當動詞的受詞。`,
 paras:[
  {t:`There are countless reasons to [be grateful for|對…心懷感激] living in the modern world. Technologies from phones and planes to fridges and [blenders|果汁機] make our lives much more comfortable and [luxurious|奢華的] than those of our ancestors. <<But>> perhaps no [innovations|創新] have [spared people from|使人免於] more [misery|悲慘痛苦] than [anesthetics|麻醉劑], the medicines that [put us to sleep|使人入睡（麻醉）] and stop us from feeling pain during [surgeries|手術].`, s:"現代科技讓生活舒適，但最大的恩賜可能是麻醉劑。注意 no … more … than 句型＝最高級。"},
  {t:`<<Before>> anesthesia was invented, [surgery|外科手術] was one of the most [terrifying|令人恐懼的] experiences a person could face. Patients remained fully awake as doctors cut into their bodies, [physically|身體上地] [held down|壓制住] by four or more strong men. A patient's screams were simply part of the [procedure|手術程序]. Surgeons focused on speed to make the suffering as brief as possible—the Scottish [surgeon|外科醫師] Robert Liston could [amputate|截肢] a leg in 25 seconds—<<but>> the [agony|極度痛苦] was still [appalling|駭人的].`, s:"麻醉發明前，病人清醒著被壓住開刀；醫生只能拚速度，但痛苦仍然可怕。"},
  {t:`Other methods for reducing pain included giving the patient alcohol, [opium|鴉片], or [nitrous oxide|笑氣], substances that people otherwise used for pleasure. Sometimes, surgeons even tried to [hypnotize|催眠] patients or [knock them unconscious|把他們打到失去知覺] with [a blow to the head|猛擊頭部]. None of these methods, <<however>>, were particularly effective.`, s:"酒精、鴉片、笑氣、催眠，甚至把人打昏——都不太有效。"},
  {t:`This all changed in 1846, when an American dentist named William Morton demonstrated the use of [ether|乙醚] as an [anesthetic|麻醉劑]. When [inhaled|吸入], ether made Morton's patient unconscious, allowing the dentist to operate. Upon waking up, the patient confirmed {{that he hadn't felt any pain during the procedure}}. It was a [miraculous|奇蹟般的] breakthrough, and within weeks, Liston started using ether in London.`, s:"1846 年莫頓示範乙醚麻醉，病人醒來說完全不痛；幾週內李斯頓也開始在倫敦使用。"},
  {t:`<<While>> ether clearly had [massive|巨大的] benefits, it wasn't perfect. Breathing it in was very unpleasant, which often caused patients to cough or [vomit|嘔吐], and it could easily [catch fire|著火]. [Chloroform|氯仿] soon started to be used instead, <<but>> finding the right [dosage|劑量] proved to be difficult, as too much could cause a patient's death. The English [physician|醫生] John Snow [experimented with|嘗試；用…做實驗] different [doses|劑量], carefully working out exactly {{how much should be used}}. He was <<so>> confident <<that>> he even gave chloroform to Queen Victoria when she [gave birth|分娩] in 1853.`, s:"乙醚會讓人咳嗽嘔吐又易燃；改用氯仿後劑量難抓，斯諾研究出精確用量，1853 年還為維多利亞女王分娩時使用。"},
  {t:`Today, anesthesia is an [established|已確立的] part of modern medicine. It allows us to [undergo|接受（手術）] important procedures in a safe and relatively comfortable way. We may [take it for granted|視為理所當然], <<but>> we should always remember {{how lucky we are to have it}}.`, s:"麻醉現在是醫學的常規，別把它視為理所當然。"}

  {id:"u13r", name:"課文理解", qs:[
   {q:"What does the example of Robert Liston in day one most clearly illustrate?", o:["Before anesthesia, surgical skill was often measured by speed.","Surgeons in the 1800s could perform a wide variety of complex operations.","Most surgeries were successful in the 1800s.","Amputations were the most common medical procedure before anesthesia became available."], a:0, e:"第 13–15 行：醫生拚速度讓痛苦盡量短，李斯頓 25 秒就能截肢——說明當時外科技術是用「速度」衡量。"},
   {q:"Choose the timeline that shows the correct order.<br><small>① John Snow developed safer methods for administering chloroform.<br>② Robert Liston made a point of completing surgeries as quickly as possible.<br>③ William Morton demonstrated the use of ether as an anesthetic.<br>④ Queen Victoria received chloroform during childbirth.</small>", o:["③ → ② → ④ → ①","② → ③ → ① → ④","① → ③ → ② → ④","④ → ① → ② → ③"], a:1, e:"李斯頓拚速度（麻醉前）→ 1846 莫頓示範乙醚 → 斯諾研究氯仿劑量 → 1853 女王分娩時使用。"},
   {q:"Which of the following was NOT a problem with ether?", o:["It often made patients cough.","It could easily catch fire.","It sometimes caused patients to vomit.","It was too expensive for most hospitals."], a:3, e:"第 34–37 行提到咳嗽、嘔吐、易燃，沒有提到價格。"},
   {q:"Why was John Snow confident enough to give chloroform to Queen Victoria?", o:["He had worked out exactly how much should be used.","Ether had been banned in England.","The queen had used chloroform many times before.","Chloroform never caused any side effects."], a:0, e:"第 41–43 行：他實驗不同劑量，精確算出該用多少（how much should be used 是名詞子句）。"},
   {q:"What is the main message of the last paragraph?", o:["We should appreciate anesthesia instead of taking it for granted.","Anesthesia is still too dangerous to use.","Modern surgery no longer needs anesthesia.","Patients should choose their own dosage."], a:0, e:"We may take it for granted, but we should always remember how lucky we are to have it."}

{
 id:"u14", tab:"Unit 14 主題式寫作", title:"The More, the Merrier—or Not?", zh:"人多好，還是一個人更好？",
 note:`<h4>老師導讀</h4>這是「比較兩種方式＋表達偏好」的兩段式作文。<b>第一段</b>：首句帶出兩種選擇 → 獨旅優點 → <span class="tr">In contrast</span> 轉到結伴旅行 → <span class="tr">In addition</span> 加碼優點 → <span class="tr">However</span> 帶出缺點 → Both… 總結。<b>第二段</b>：<span class="tr">Personally</span> 表態 → 理由（Instead of… / also）→ <span class="tr">Although</span> 讓步收尾。學會這個骨架，就能套用到「個人報告 vs. 分組報告」。`,
 paras:[
  {t:`When traveling, people often choose between taking a trip alone and going with friends or family members. [Solo|單人的] travel offers greater freedom and [flexibility|彈性]. With no need to [compromise|妥協] with others, solo travelers can adjust their plans [on the spur of the moment|一時興起] and fully enjoy [destinations|目的地] at their own pace. <<In contrast>>, traveling in a group allows people to share experiences, [split|分攤] expenses, and create lasting memories together. <<In addition>>, [companions|同伴] can support one another when unexpected problems [occur|發生], which makes the journey feel safer and less [stressful|有壓力的]. <<However>>, group trips aren't always [smooth sailing|一帆風順]. <<Since>> everyone may have different interests, budgets, and schedules, disagreements can sometimes [arise|發生]. Both travel styles have their own strengths and appeal to different kinds of travelers.`, s:"第一段：比較獨自旅行（自由、彈性）與結伴旅行（分享、分攤、互相支援；但可能有爭執），最後總結兩者各有優點。"},
  {t:`<<Personally>>, I prefer traveling alone because I value independence and flexibility. <<Instead of>> adjusting to other people's desires or following a schedule that may not suit me, I get to have full control over my journey. I can stay longer at places that capture my interest, [venture off the beaten path|探索人跡罕至之處], or simply [go with the flow|順其自然] without worrying about conflicting opinions. Traveling alone <<also>> pushes me out of my [comfort zone|舒適圈] and teaches me to [think on my feet|隨機應變] when challenges [come up|出現]. <<Although>> solo travel can [occasionally|偶爾] feel lonely, the sense of freedom and personal growth it brings [is second to none|無人能及].`, s:"第二段：作者偏好獨旅——能完全掌控行程、走出舒適圈、學會隨機應變；雖然偶爾寂寞，但自由與成長無可取代。"}
 ],

let AC=null;
function tone(f,t,d,type="sine",v=.16,f2){const c=AC,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t+d);g.gain.setValueAtTime(0,c.currentTime+t);g.gain.linearRampToValueAtTime(v,c.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.05);}
function sfx(n){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){return;}
 if(n==="ok"){[784,1047,1319].forEach((f,i)=>tone(f,i*.07,.22,"sine",.15));tone(2637,.2,.25,"triangle",.04);}
 else if(n==="bad"){tone(330,0,.14,"triangle",.12);tone(247,.13,.2,"triangle",.12);}
 else if(n==="tick")tone(1200,0,.05,"sine",.06);
 else if(n==="flip")tone(500,0,.12,"sine",.08,900);
 else if(n==="badge"){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.08,.3,"triangle",.11));}
 else if(n==="level"){[392,523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.4,"square",.05));[1319,1568,2093].forEach((f,i)=>tone(f,.5+i*.06,.5,"sine",.1));}

const COLORS=["#F5A7B7","#F3D88A","#BBA8E2","#FFFFFF","#E07A8E"];
function burst(el,n=16){if(RM||!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fx";s.textContent=["✦","❀","♥","✿","★"][i%5];s.style.color=COLORS[i%5];s.style.textShadow="0 0 2px rgba(142,34,56,.4)";document.body.appendChild(s);
  const a=Math.random()*Math.PI*2,d=50+Math.random()*70;
  s.animate([{transform:`translate(${x}px,${y}px) scale(.4)`,opacity:1},{transform:`translate(${x+Math.cos(a)*d}px,${y+Math.sin(a)*d}px) scale(1.1) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:700+Math.random()*300,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove();}}
function petals(n=40){if(RM)return;const W=innerWidth;for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fx";s.textContent=["❀","✿","✦","♥"][i%4];s.style.color=COLORS[i%5];s.style.fontSize=(14+Math.random()*16)+"px";document.body.appendChild(s);
 const x=Math.random()*W,dx=(Math.random()-.5)*160;s.animate([{transform:`translate(${x}px,-30px) rotate(0)`,opacity:1},{transform:`translate(${x+dx}px,${innerHeight+30}px) rotate(${360+Math.random()*360}deg)`,opacity:.8}],{duration:1800+Math.random()*1500,delay:Math.random()*600,easing:"ease-in"}).onfinish=()=>s.remove();}}

function matchGame(u,box){
 const pick=shuffle(u.vocab).slice(0,6);let sel=null,done=0;

 box.onclick=e=>{if(e.target.closest("[data-re]")){matchGame(u,box);sfx("tick");return;}

function orderGame(u,box){
 const items=u.order.items.map((x,i)=>({t:x[0],y:x[1],i}));let next=0;
 box.innerHTML=`<div class="ord-src">${shuffle(items).map(x=>`<button class="ord-item" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div><div class="ord-dst"></div><div class="row" style="justify-content:center;margin-top:12px"><button class="big ghost" data-re>↺ 重新排</button></div>`;
 const dst=box.querySelector(".ord-dst");
 box.onclick=e=>{if(e.target.closest("[data-re]")){orderGame(u,box);sfx("tick");return;}
  const b=e.target.closest(".ord-item");if(!b)return;const i=+b.dataset.i;
  if(i===next){const x=items[i];right(b);b.remove();dst.insertAdjacentHTML("beforeend",`<div class="placed"><span class="num">${next+1}</span><span>${esc(x.t)}</span>${x.y?`<span class="yr">${esc(x.y)}</span>`:""}</div>`);next++;
   if(next===items.length){setTimeout(()=>{petals(34);badge("order");toast("⏳","排序完成！",u.order.kind==="timeline"?"答案就是 ②→③→①→④":"第二段骨架你記住了");},300);}}
  else wrong(b);};
}
function clozeGame(u,box){
 const c=u.cloze;let cur=null;const filled={};
 const bank=shuffle(c.ans.concat(c.extra));
 box.innerHTML=`<div class="cloze-text">${esc(c.text).replace(/\{(\d+)\}/g,(m,n)=>`<button class="bl" data-n="${n}">（${+n+1}）</button>`)}</div>
 <div class="bank">${bank.map(w=>`<button class="chip" data-w="${w}">${w}</button>`).join("")}</div>
 <div class="row" style="justify-content:center;margin-top:12px">${S.mode==="exam"?`<button class="big" data-sub>交卷</button>`:""}<button class="big ghost" data-re>↺ 重做</button><button class="mini say" data-read>朗讀完整短文</button></div><div class="board score"></div>`;
 const blanks=[...box.querySelectorAll(".bl")];
 const selectBl=b=>{blanks.forEach(x=>x.classList.remove("sel"));cur=b;if(b)b.classList.add("sel");};
 selectBl(blanks[0]);
 const nextEmpty=()=>blanks.find(x=>!x.classList.contains("ok")&&!(S.mode==="exam"&&filled[x.dataset.n]));
 box.onclick=e=>{
  if(e.target.closest("[data-re]")){clozeGame(u,box);sfx("tick");return;}
  if(e.target.closest("[data-read]")){say(c.text.replace(/\{(\d+)\}/g,(m,n)=>c.ans[n]));return;}
  if(e.target.closest("[data-sub]")){let ok=0;blanks.forEach(b=>{const n=b.dataset.n;b.classList.remove("sel");if(filled[n]===c.ans[n]){b.classList.add("ok");ok++;}else{b.classList.add("no");b.textContent=`${filled[n]||"（空）"} → ${c.ans[n]}`;}});
   const sc=box.querySelector(".score");sc.innerHTML=`<div class="n">${ok} / ${blanks.length}</div>${ok===blanks.length?"全對！太厲害了 ✦":"紅色的空格看看正確答案"}`;sc.classList.add("show");
   if(ok===blanks.length){sfx("level");petals(50);badge("cloze");gain(30);}else{sfx(ok/blanks.length>=.7?"ok":"bad");gain(ok*3);}
   e.target.closest("[data-sub]").remove();return;}
  const b=e.target.closest(".bl");if(b&&!b.classList.contains("ok")&&!b.classList.contains("no")){selectBl(b);sfx("tick");return;}
  const ch=e.target.closest(".chip");if(!ch||!cur)return;const w=ch.dataset.w,n=cur.dataset.n;
  if(S.mode==="exam"){if(filled[n]){const old=box.querySelector(`.chip[data-w="${filled[n]}"]`);if(old)old.classList.remove("used");}
   filled[n]=w;cur.textContent=w;ch.classList.add("used");sfx("tick");selectBl(nextEmpty()||null);return;}
  if(w===c.ans[n]){cur.textContent=w;cur.classList.remove("sel");cur.classList.add("ok");ch.classList.add("used");right(cur);selectBl(nextEmpty()||null);
   if(!nextEmpty()){setTimeout(()=>{petals(40);badge("cloze");toast("🧁","文意選填完成！","按「朗讀完整短文」聽一次");},350);}}
  else{wrong(cur);shake(ch);}};
}

/* ============ QUIZZES ============ */
function vocabQuiz(u){
 const pool=u.vocab;return shuffle(pool).map((v,k)=>{
  const others=shuffle(pool.filter(x=>x!==v)).slice(0,3);const type=k%3;
  if(type===0){const form=v[8]||v[0];return {q:esc(v[5]).replace(new RegExp("\\b"+form+"\\w*","i"),'<span class="blank">＿＿＿</span>'),o:shuffle([form].concat(others.map(x=>x[0]))),ans:form,e:`${form}：${v[3]}｜${v[6]}`};}
  if(type===1)return {q:`哪一個字的意思是「${shortZh(v[3])}」？`,o:shuffle([v[0]].concat(others.map(x=>x[0]))),ans:v[0],e:`${v[0]} [${v[1]}] ${v[2]} ${v[3]}`};
  return {listen:v[0],q:"聽發音，選出你聽到的單字",o:shuffle([v[0]].concat(others.map(x=>x[0]))),ans:v[0],e:`${v[0]} [${v[1]}]：${v[3]}`};
 }).map(q=>({...q,a:q.o.indexOf(q.ans)}));
}
function renderQuiz(u,box){
 box.innerHTML=`<div class="mode" role="group" aria-label="作答模式"><button data-m="review" aria-pressed="${S.mode==="review"}">🌸 複習模式</button><button data-m="exam" aria-pressed="${S.mode==="exam"}">📝 考試模式</button></div>
 <p class="hint">${S.mode==="review"?"點選答案後馬上看到對錯和解析。":"全部選完再按交卷，最後一起算分數。"}</p>
 <div id="qs-${u.id}"></div>`;
 box.querySelector(".mode").onclick=e=>{const b=e.target.closest("[data-m]");if(!b||S.mode===b.dataset.m)return;S.mode=b.dataset.m;save();sfx("tick");renderQuiz(u,box);};
 const host=$("#qs-"+u.id);
 const sets=[{id:u.id+"v",name:"字彙測驗",qs:vocabQuiz(u)}].concat(u.quizzes);
 sets.forEach(set=>{const d=document.createElement("section");d.className="qset";host.appendChild(d);quizSet(d,set,set.id.endsWith("v")?()=>vocabQuiz(u):null);});
}
function quizSet(d,set,regen){
 const qs=set.qs;let answered=0,okN=0;const picks={};
 d.innerHTML=`<div class="qset-h"><h3 class="sec-t" style="margin:16px 0 4px">${set.name}</h3><small style="color:var(--ink2)">${qs.length} 題</small></div>${set.intro?`<p class="hint" style="margin-top:4px">${set.intro}</p>`:""}
 ${qs.map((q,qi)=>`<div class="board q" data-q="${qi}"><p class="qt"><span class="qn">${qi+1}</span>${q.q}</p>${q.listen?`<button class="listen" data-l="${esc(q.listen)}">🔊 播放</button>`:""}<div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}"><span class="lt">${"ABCD"[oi]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="exp">💡 ${q.e}</div></div>`).join("")}
 <div class="row" style="justify-content:center">${S.mode==="exam"?`<button class="big" data-sub>交卷</button>`:""}<button class="big ghost" data-re>↺ 重做這組</button></div><div class="board score"></div>`;
 const sc=d.querySelector(".score");
 const finish=()=>{const r=okN/qs.length;sc.innerHTML=`<div class="n">${okN} / ${qs.length}</div>${r===1?"全對！收下滿分貼紙 ⭐":r>=.8?"好棒，差一點點就滿分！":"錯的題目看看解析，再做一次會更好"}`;sc.classList.add("show");
  if(r===1){sfx("level");petals(56);if(S.mode==="exam")badge("perfect");gain(20);}else if(r>=.8){sfx("ok");petals(18);}};
 d.onclick=e=>{
  const l=e.target.closest("[data-l]");if(l){say(l.dataset.l);return;}
  if(e.target.closest("[data-re]")){if(regen)set.qs=regen();quizSet(d,set,regen);sfx("tick");return;}
  if(e.target.closest("[data-sub]")){if(Object.keys(picks).length<qs.length){const miss=[...d.querySelectorAll(".q")].find(c=>picks[c.dataset.q]===undefined);shake(miss);miss.scrollIntoView({behavior:"smooth",block:"center"});toast("📝","還有題目沒選喔","第 "+(+miss.dataset.q+1)+" 題");return;}
   d.querySelectorAll(".q").forEach(c=>{const qi=+c.dataset.q,q=qs[qi],btns=c.querySelectorAll(".opt");btns.forEach(b=>b.classList.remove("pick"));btns[q.a].classList.add("ok");if(picks[qi]===q.a)okN++;else btns[picks[qi]].classList.add("no");c.querySelector(".exp").classList.add("show");});
   e.target.closest("[data-sub]").remove();answered=qs.length;gain(okN*5);S.streak=0;save();drawStats();finish();return;}
  const b=e.target.closest(".opt");if(!b)return;const c=b.closest(".q"),qi=+c.dataset.q,q=qs[qi],oi=+b.dataset.o;
  if(S.mode==="exam"){if(answered===qs.length)return;c.querySelectorAll(".opt").forEach(x=>x.classList.remove("pick"));b.classList.add("pick");picks[qi]=oi;sfx("tick");return;}
  if(c.dataset.done)return;c.dataset.done=1;answered++;const btns=c.querySelectorAll(".opt");btns[q.a].classList.add("ok");
  if(oi===q.a){okN++;right(b);}else{b.classList.add("no");wrong(b);}
  c.querySelector(".exp").classList.add("show");if(answered===qs.length)setTimeout(finish,300);};
}

/* ============ LAYOUT ============ */
const SUBS=[["read","📖 課文"],["vocab","🃏 單字卡"],["phr","🎀 片語句型"],["game","🎮 小遊戲"],["quiz","📝 測驗"]];
let curU=0,curS="read";
function renderUnits(){$("#units").innerHTML=UNITS.map((u,i)=>`<button class="unit-tab" role="tab" aria-selected="${i===curU}" data-u="${i}">${u.tab}</button>`).join("");}
$("#units").onclick=e=>{const b=e.target.closest("[data-u]");if(!b)return;curU=+b.dataset.u;sfx("tick");renderUnits();renderUnit();};
function renderUnit(){const u=UNITS[curU];
 $("#unitBox").innerHTML=`<div class="unit-head"><h2>${esc(u.title)}</h2><p>${u.zh}</p></div><div class="subs" role="tablist">${SUBS.map(s=>`<button class="sub-tab" role="tab" data-s2="${s[0]}" aria-selected="${s[0]===curS}">${s[1]}</button>`).join("")}</div><div class="panel" id="panel"></div>`;
 $("#unitBox .subs").onclick=e=>{const b=e.target.closest("[data-s2]");if(!b)return;curS=b.dataset.s2;sfx("tick");renderUnit();};
 const p=$("#panel");({read:renderPassage,vocab:renderVocab,phr:renderPhrases,game:renderGames,quiz:renderQuiz})[curS](u,p);}

/* tools */
const syncTools=()=>{$("#sndBtn").textContent=S.sound?"🔔 音效開":"🔕 音效關";$("#rateBtn").textContent=S.slow?"🐢 慢速":"🐇 正常";};
$("#sndBtn").onclick=()=>{S.sound=!S.sound;save();syncTools();sfx("tick");};
$("#rateBtn").onclick=()=>{S.slow=!S.slow;save();syncTools();say(S.slow?"slow":"normal");};
$("#themeBtn").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme==="dark";r.dataset.theme=dark?"light":"dark";$("#themeBtn").textContent=dark?"🌙":"☀️";try{localStorage.setItem(KEY+"-theme",r.dataset.theme);}catch(e){}};
(function(){let th=null;try{th=localStorage.getItem(KEY+"-theme");}catch(e){}
 if(!th)th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
 document.documentElement.dataset.theme=th;$("#themeBtn").textContent=th==="dark"?"☀️":"🌙";})();

/* decorative flowers in hero */
(function(){const h=$("#hero");const f=(x,y,s,o)=>`<svg class="flower" style="left:${x};top:${y};width:${s}px;opacity:${o}" viewBox="0 0 40 40" aria-hidden="true">${[0,72,144,216,288].map(a=>`<ellipse cx="20" cy="10" rx="7" ry="9" fill="#fff" transform="rotate(${a} 20 20)"/>`).join("")}<circle cx="20" cy="20" r="4.5" fill="#F3D88A"/></svg>`;
 h.insertAdjacentHTML("beforeend",f("62%","58%",30,.9)+f("78%","70%",20,.8)+f("88%","42%",24,.85)+f("4%","72%",16,.6)+f("55%","24%",14,.7));})();

S.streak=0;syncTools();drawStats();renderUnits();renderUnit();
</script>
